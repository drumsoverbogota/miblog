{% load static %}
{% load fullurl %}

<!DOCTYPE html>
<html>
<head>
    <title>Transaction Inbox</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>

        body {
            font-family: Arial;
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

/* =========================
   TABLE WRAPPER
========================= */

.table-wrapper {
    width: 100%;

    overflow-x: auto;

    -webkit-overflow-scrolling: touch;

    margin-bottom: 30px;
}

/* =========================
   TABLE
========================= */

.tx-table {
    width: 100%;

    min-width: 500px;

    border-collapse: collapse;

    background: white;

    border-radius: 14px;

    overflow: hidden;
}

/* =========================
   TABLE CELLS
========================= */

.tx-table th,
.tx-table td {
    padding: 14px 16px;

    border-bottom: 1px solid #eee;

    text-align: left;

    white-space: nowrap;
}

.tx-table th {
    background: #f8f8f8;

    font-weight: 600;
}

.tx-table tr:hover {
    background: #fafafa;
}

/* =========================
   INPUTS INSIDE TABLES
========================= */

.tx-table input,
.tx-table select {
    width: 100%;

    min-width: 120px;

    padding: 10px;

    border-radius: 8px;

    border: 1px solid #ccc;

    box-sizing: border-box;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .tx-table th,
    .tx-table td {
        padding: 12px;
    }

}

        .messages {
            list-style: none;
            padding: 0;
        }

        .messages li {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .messages .success { background: #d4edda; }
        .messages .error { background: #f8d7da; }

        .regex-section {
            margin-top: 40px;
        }

        .regex-table {
            width: 100%;
            border-collapse: collapse;
        }

        .regex-table th,
        .regex-table td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        .regex-table th {
            background: #f5f5f5;
        }

        .regex-table code {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 13px;
        }
.chart-box {
    position: relative;
    width: 100%;
    max-width: 800px;
    height: 450px;
    margin: 0 auto 40px auto;
}

.chart-box canvas {
    width: 100% !important;
    height: 100% !important;
}
.form-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 500px;
    margin: auto;
    padding: 16px;
}

.form-container input,
.form-container select,
.form-container button {
    font-size: 16px; /* important for mobile */
    padding: 14px;
    border-radius: 10px;
    border: 1px solid #ccc;
    width: 100%;
    box-sizing: border-box;
}

.form-container button {
    background: #2563eb;
    color: white;
    border: none;
    font-weight: bold;
    cursor: pointer;
}

.form-container button:hover {
    opacity: 0.95;
}

.checkbox-row {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 14px 16px;

    border: 1px solid #dcdcdc;
    border-radius: 12px;

    background: white;

    font-size: 16px;
    cursor: pointer;
}

.checkbox-row input[type="checkbox"] {
    width: 22px;
    height: 22px;

    accent-color: #2563eb;

    margin: 0;
    cursor: pointer;
}

    </style>
</head>

<body>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    {% block extra_js %}
    {% endblock %}
</body>
</html>
