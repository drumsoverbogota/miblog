{% load static %}
{% load fullurl %}

<!DOCTYPE html>
<html>
<head>
    <title>Transaction Inbox</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>

        body {
            font-family: Arial;
            max-width: 1000px;
            margin: auto;
            padding: 20px;
        }

        .tx-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 30px;
        }

        .tx-table th,
        .tx-table td {
            border: 1px solid #ddd;
            padding: 10px;
            vertical-align: top;
        }

        .tx-table th {
            background: #f5f5f5;
        }

        .tx-table input,
        .tx-table select {
            width: 140px;
        }

        .messages {
            list-style: none;
            padding: 0;
        }

        .messages li {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        .messages .success { background: #d4edda; }
        .messages .error { background: #f8d7da; }

        .regex-section {
            margin-top: 40px;
        }

        .regex-table {
            width: 100%;
            border-collapse: collapse;
        }

        .regex-table th,
        .regex-table td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        .regex-table th {
            background: #f5f5f5;
        }

        .regex-table code {
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 13px;
        }

        .chart-box {
            width: 100%;
            max-width: 800px;
            height: 450px;
            margin-bottom: 40px;
        }

    </style>
</head>

<body>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    {% block extra_js %}
    {% endblock %}
</body>
</html>
